name: Verify Halina

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  application:
    name: Application and PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: halina_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: halina_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d halina_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Disposable service container only; no Supabase or production secrets.
      DIRECT_URL: postgresql://postgres:halina_ci_only@127.0.0.1:5432/halina_ci
      HALINA_TEST_DATABASE_URL: postgresql://postgres:halina_ci_only@127.0.0.1:5432/halina_ci
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Prepare Supabase schema dependencies in disposable PostgreSQL
        env:
          PGPASSWORD: halina_ci_only
        run: psql -h 127.0.0.1 -U postgres -d halina_ci -v ON_ERROR_STOP=1 -f test/postgres/bootstrap.sql
      - name: Apply committed migrations
        run: npx prisma migrate deploy
      - run: npx prisma migrate status
      - run: npm run lint
      - run: npm run typecheck
      - name: Unit and real PostgreSQL integration tests
        run: npm test
      - run: npm run build

  browser:
    name: Manager browser workflows
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- --workers=1
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: browser-failures
          path: test-results/
          retention-days: 7

  authenticated:
    name: Authenticated manager and staff
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      HALINA_AUTH_E2E: "true"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@v1
        with:
          version: 2.117.0
      - run: supabase init --workdir test
      - name: Start isolated Supabase services
        run: supabase start --workdir test > /dev/null
      - name: Configure local service connections
        run: node test/configure-auth-ci.mjs
      - name: Apply migrations to local Supabase
        run: npx prisma migrate deploy
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- --workers=1
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: authenticated-browser-failures
          path: test-results/
          retention-days: 7
